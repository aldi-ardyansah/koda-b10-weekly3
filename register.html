<input type="checkbox" id="register-toggle" hidden>
<div class="login-overlay">
    <div class="register-modal">
        <div class="login-modal-header">
            <div>
                <h2 class="fraunces">Register Citizen Account</h2>
                <p class="public-sans">Sign in to lodge a complaint or upvote issues.</p>
            </div>
            <label for="register-toggle" class="login-close"><img src="icons/i-close.svg" alt="Icon Close"></label>
        </div>
        <div class="register-modal-body">
            <div class="login-tabs">
                <a href="login.html" class="login-tab-inactive public-sans">Sign In Existing Account</a>
                <span class="login-tab-active public-sans">Register as Citizen</span>
            </div>
            <form class="register-form">
                <div class="register-field">
                    <label class="ibm-plex-mono" for="register-name">FULL NAME (NAMA LENGKAP) *</label>
                    <div class="register-input public-sans">
                        <img src="icons/i-user.svg" alt="Icon User">
                        <input type="text" id="register-name" placeholder="e.g. Budi Santoso" required>
                    </div>
                </div>
                <div class="register-field-row">
                    <div class="register-field">
                        <label class="ibm-plex-mono" for="register-email">EMAIL ADDRESS *</label>
                        <div class="register-input">
                            <input type="email" id="register-email" placeholder="e.g. budi@wargareport.id" required>
                        </div>
                    </div>
                    <div class="register-field">
                        <label class="ibm-plex-mono" for="register-phone">PHONE / WHATSAPP *</label>
                        <div class="register-input">
                            <input type="tel" id="register-phone" placeholder="+62 812-..." required>
                        </div>
                    </div>
                </div>
                <div class="register-field">
                    <label class="ibm-plex-mono" for="register-nik">NIK</label>
                    <div class="register-input">
                        <input type="text" id="register-nik" placeholder="16 digits for verified resident badge (e.g. 3174...)" maxlength="16">
                    </div>
                    <span class="register-helper public-sans">Used exclusively for verification under UU PDP and never shown to the public.</span>
                </div>
                <div class="register-field">
                    <label class="ibm-plex-mono" for="register-password">PASSWORD *</label>
                    <div class="register-input">
                        <img src="icons/i-lock.svg" alt="Icon Lock">
                        <input type="password" id="register-password" placeholder="Create a password" required>
                        <img class="login-eye" src="icons/i-eye.svg" alt="Icon Eye">
                    </div>
                </div>
                <button type="submit" class="register-submit public-sans">
                    <span>✓</span> Create Account &amp; Continue
                </button>
            </form>
        </div>
    </div>
</div>
