<input type="checkbox" id="login-toggle" hidden>
<div class="login-overlay">
    <div class="login-modal">
        <div class="login-modal-header">
            <div>
                <h2 class="fraunces">Sign In to WargaReport</h2>
                <p class="public-sans">Sign in to lodge a complaint or upvote issues.</p>
            </div>
            <label for="login-toggle" class="login-close"><img src="icons/i-close.svg" alt="Icon Close"></label>
        </div>
        <div class="login-modal-body">
            <div class="login-tabs">
                <span class="login-tab-active public-sans">Sign In Existing Account</span>
                <a href="#" class="login-tab-inactive public-sans">Register as Citizen</a>
            </div>
            <form class="login-form">
                <div class="login-field">
                    <label class="ibm-plex-mono" for="login-email">EMAIL ADDRESS</label>
                    <div class="login-input">
                        <img src="icons/i-email.svg" alt="Icon Email">
                        <input type="email" id="login-email" placeholder="Enter your Email" required>
                    </div>
                </div>
                <div class="login-field">
                    <label class="ibm-plex-mono" for="login-password">PASSWORD</label>
                    <div class="login-input">
                        <img src="icons/i-lock.svg" alt="Icon Lock">
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <img class="login-eye" src="icons/i-eye.svg" alt="Icon Eye">
                    </div>
                </div>
                <button type="submit" class="login-submit public-sans">
                    Sign In <span>→</span>
                </button>
            </form>
        </div>
    </div>
</div>
